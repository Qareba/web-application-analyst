<!DOCTYPE html>
<html>
<head>
    <title>Results of parsing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/results.css') }}">
</head>
<body>
    <div class="container">
        <h2 class="title">Parsed products</h2>
        <div class="products-list">
            <a href="/" class="back-link">New search</a>
            {% for row in data %}
                <div class="product-card">
                    <div class="product-row"><span class="product-label">ID:</span> <span class="product-value">{{ row[0] }}</span></div>
                    <div class="product-row"><span class="product-label">Title:</span> <span class="product-value">{{ row[1] }}</span></div>
                    <div class="product-row"><span class="product-label">Description:</span> <span class="product-value">{{ row[2] }}</span></div>
                    <div class="product-row"><span class="product-label">Condition:</span> <span class="product-value">{{ row[3] }}</span></div>
                    <div class="product-row"><span class="product-label">Price:</span> <span class="product-value">{{ row[4] }}</span></div>
                    <div class="product-row"><span class="product-label">Date:</span> <span class="product-value">{{ row[5] }}</span></div>
                    <div class="product-row"><span class="product-label">Location:</span> <span class="product-value">{{ row[6] }}</span></div>
                    <div class="product-row"><span class="product-label">Image:</span> <span class="product-value">{{ row[7] }}</span></div>
                    <div class="product-row"><span class="product-label">Link:</span> <span class="product-value"><a href="{{ row[8] }}" target="_blank">Open</a></span></div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
